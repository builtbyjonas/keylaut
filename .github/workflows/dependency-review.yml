name: Dependency Review

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Review Dependencies
        uses: actions/dependency-review-action@v5
